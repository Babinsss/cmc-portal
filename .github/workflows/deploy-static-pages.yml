name: Deploy Static Portal to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, gd, zip

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS dependencies and build Vite bundle
        run: |
          npm ci
          npm run build

      - name: Prepare SQLite database and seed portal data
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env
          php artisan migrate --force
          php artisan db:seed --force

      - name: Export static bundle for GitHub Pages
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          BASE_PATH=""
          if [[ "${{ github.repository }}" != *.github.io ]]; then
            BASE_PATH="/${REPO_NAME}"
          fi
          php artisan portal:export-static --output=dist --base-path="${BASE_PATH}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
